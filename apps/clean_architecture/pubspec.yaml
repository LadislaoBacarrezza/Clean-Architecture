name: clean_architecture
description: "An example of clean architecture with Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  mi_proyecto_domain:
      path: ../../packages/domain
  mi_proyecto_data:
      path: ../../packages/data
  pdp_feature:
      path: ../../packages/features/pdp
  checkout_feature:
      path: ../../packages/features/checkout

  # Librerías externas
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
